<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>同频 · 我的（手账）</title>
<link rel="stylesheet" href="journal-base.css">
<style>
/* ==========================================================================
   我的 —— 一比一还原参考图
   和上一版的关键差别：
   1. 描边是**橙色**（#E8A85C），不是淡褐
   2. 顶部/底部导航是**浅绿底 + 橙边框**
   3. 便签用**圆钉**固定，三张错落叠放
   4. 资料卡右侧有**橙色圆形进度环**
   ========================================================================== */
:root{
  --o-line:#E8A85C;        /* 橙色描边 */
  --o-line-soft:#EFC08A;
  --cream-card:#FDF7E8;    /* 资料卡 / 便签底 */
  --green-nav:#E9F1DD;     /* 导航条浅绿底 */
  --tag-bg:#F5C99A;        /* 橙色标签底 */
  --pin:#F2DCC0;           /* 圆钉 */
}

/* ==================== 顶部导航胶囊 ==================== */
.topnav{
  display:flex;align-items:center;justify-content:center;position:relative;
  height:42px;border-radius:21px;margin-top:2px;
  background:var(--green-nav);
  border:1.6px solid var(--o-line);
  box-shadow:0 4px 12px rgba(200,165,125,.16), inset 0 1.5px 0 rgba(255,255,255,.6);
}
.topnav .ttl{font-size:14.5px;font-weight:800;color:#4A3828;letter-spacing:.06em}
.topnav .gear{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  width:22px;height:22px}
.topnav .gear img{width:100%;height:100%;display:block;opacity:.85}

/* 大标题 */
.h1{font-size:25px;font-weight:800;color:#3D2E20;letter-spacing:-.01em;
  padding:14px 2px 10px}

/* ==================== 资料卡 ==================== */
.profile{
  position:relative;padding:13px 14px 11px;
  border-radius:20px 22px 19px 21px;
  background:var(--cream-card);
  border:1.6px solid var(--o-line);
  box-shadow:0 8px 20px rgba(200,165,125,.18);
}
.pf-top{display:flex;align-items:center;gap:11px}
.pf-ava{
  width:56px;height:56px;border-radius:50%;flex:none;
  background:linear-gradient(150deg,#6E92C2,#4A6E9E);
  display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;color:#fff;
  border:2px solid #fff;
  box-shadow:0 4px 10px rgba(74,110,158,.28);
}
.pf-info{flex:1;min-width:0}
.pf-name{display:flex;align-items:center;gap:6px}
.pf-name h2{font-size:18px;font-weight:800;color:#3D2E20;letter-spacing:-.01em}
.pf-badge{padding:2px 7px;border-radius:8px;font-size:8.5px;font-weight:700;
  background:#EDE8DC;color:#8C7A62;border:1px solid rgba(160,140,115,.24)}
.pf-school{margin-top:3px;font-size:10.5px;color:#8C7A62}
.pf-tag{margin-top:6px;display:inline-block;padding:3px 10px;border-radius:10px;
  font-size:9.5px;font-weight:700;color:#7A5A3C;
  background:#FDFBF4;border:1.2px solid var(--o-line-soft)}

/* 进度环 */
.pf-ring{position:relative;width:56px;height:56px;flex:none}
.pf-ring .ring{
  width:100%;height:100%;border-radius:50%;
  background:conic-gradient(#E8A85C 0deg 330deg, rgba(232,168,92,.20) 330deg 360deg);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.pf-ring .ring::before{
  content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cream-card);
}
.pf-ring .num{
  position:relative;z-index:2;font-size:16px;font-weight:800;color:#4A3828;
  font-variant-numeric:tabular-nums;
}
.pf-ring .stk{
  position:absolute;right:-4px;bottom:2px;width:16px;height:16px;border-radius:4px;
  background:#FDFBF4;border:1.2px solid var(--o-line-soft);
  transform:rotate(-12deg);
}

/* 三统计 */
.pf-stats{display:flex;align-items:center;margin-top:12px;
  padding-top:10px;border-top:1.4px dashed rgba(232,168,92,.42)}
.pf-stats .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.pf-stats .s + .s{border-left:1.2px solid rgba(232,168,92,.28)}
.pf-stats .n{font-size:16px;font-weight:800;color:#3D2E20;line-height:1.1;
  font-variant-numeric:tabular-nums}
.pf-stats .n em{font-style:normal;font-size:9.5px;color:#8C7A62;font-weight:700}
.pf-stats .l{font-size:9px;color:#8C7A62;letter-spacing:.01em}

/* ==================== 三张便签 ==================== */
.notes{position:relative;height:386px;margin-top:16px}

.note-p{
  position:absolute;
  background:var(--cream-card);
  border:1.5px solid var(--o-line-soft);
  box-shadow:0 7px 18px rgba(200,165,125,.20);
  padding:10px 11px 11px;
}
.note-p::before{
  content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #FBEDD8, var(--pin));
  border:1.2px solid rgba(200,165,125,.42);
  box-shadow:0 2px 4px rgba(160,120,80,.22);
}

.note-left{
  left:0;top:0;width:47.5%;height:212px;
  transform:rotate(-3.4deg);
  border-radius:6px 8px 5px 7px;
}
.note-right{
  right:0;top:14px;width:47.5%;height:212px;
  transform:rotate(2.8deg);
  border-radius:7px 5px 8px 6px;
}
.note-bottom{
  left:15%;top:186px;width:75%;height:190px;
  transform:rotate(-1.8deg);
  border-radius:6px 7px 5px 8px;
  z-index:3;
}

.note-p .nt{
  display:inline-block;padding:4px 12px;border-radius:10px;
  font-size:11px;font-weight:800;color:#7A4E28;
  background:var(--tag-bg);
  border:1px solid rgba(200,140,80,.30);
}
.note-p .rows{margin-top:10px;display:flex;flex-direction:column;gap:13px}
.note-p .r{display:flex;align-items:center;gap:6px}
.note-p .r .ic{width:24px;height:24px;flex:none}
.note-p .r .ic img{width:100%;height:100%;display:block;opacity:.8}
.note-p .r span{font-size:10.5px;color:#5C4634;font-weight:600;line-height:1.3}
.note-p .dash{margin-top:6px;border-top:1px dashed rgba(232,168,92,.42)}

.note-bottom .big{display:flex;align-items:center;gap:10px;margin-top:14px}
.note-bottom .big .ic{width:34px;height:34px;flex:none}
.note-bottom .big .ic img{width:100%;height:100%;display:block;opacity:.85}
.note-bottom .big .tx h3{font-size:12px;font-weight:800;color:#3D2E20}
.note-bottom .big .tx p{margin-top:3px;font-size:10px;color:#8C7A62;line-height:1.4}
.note-bottom .go{
  display:inline-flex;align-items:center;justify-content:center;
  margin-top:16px;padding:6px 18px;border-radius:14px;
  font-size:10.5px;font-weight:800;color:#7A5A3C;
  background:linear-gradient(150deg,#F7D9BC,#EFC198);
  border:1.2px solid rgba(200,160,120,.32);
  box-shadow:0 3px 8px rgba(205,175,140,.20);
}

/* ==================== 底部导航 ==================== */
.tabbar{
  position:absolute;left:14px;right:14px;bottom:14px;height:58px;z-index:20;
  border-radius:29px;
  background:var(--green-nav);
  border:1.6px solid var(--o-line);
  box-shadow:0 8px 20px rgba(200,165,125,.20), inset 0 1.5px 0 rgba(255,255,255,.6);
  display:flex;align-items:center;
}
.tab{flex:1;height:58px;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:21}
.tab img{width:21px;height:21px;display:block;opacity:.72}
.tab.on img{opacity:1}
.gap{width:54px;flex:none}
.fab{
  position:absolute;left:50%;top:-21px;transform:translateX(-50%);
  width:54px;height:54px;border-radius:50%;z-index:22;
  background:linear-gradient(155deg,#F6CB9E,#E8A45E);
  border:2px solid #FDFBF4;
  box-shadow:0 6px 14px rgba(200,150,95,.34), inset 0 2px 0 rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;
}
.fab img{width:26px;height:26px;display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">

    <div class="statusbar">
      <span>11:47</span>
      <span class="r">
        <span style="font-size:9px">149 KB/s</span>
        <span class="bars"><i></i><i></i><i></i><i></i></span>
        <span>5G</span>
        <span class="batt"></span>
      </span>
    </div>

    <div class="content" style="height:calc(844px - 44px - 86px);">

      <!-- 顶部导航胶囊 -->
      <div class="topnav">
        <span class="ttl">我的</span>
        <div class="gear"><img src="icons-journal/out/gear.png" alt=""></div>
      </div>

      <!-- 大标题 -->
      <div class="h1">我的</div>

      <!-- 资料卡 -->
      <div class="profile">
        <div class="pf-top">
          <div class="pf-ava">M</div>
          <div class="pf-info">
            <div class="pf-name">
              <h2>Mu-Rain</h2>
              <span class="pf-badge">未认证</span>
            </div>
            <div class="pf-school">未填学校</div>
            <span class="pf-tag">标签 10/10</span>
          </div>
          <div class="pf-ring">
            <div class="ring"><span class="num">100</span></div>
            <span class="stk"></span>
          </div>
        </div>

        <div class="pf-stats">
          <div class="s"><span class="n">10<em>/10</em></span><span class="l">我的标签</span></div>
          <div class="s"><span class="n">1</span><span class="l">我的好友</span></div>
          <div class="s"><span class="n">100</span><span class="l">待处理申请</span></div>
        </div>
      </div>

      <!-- 三张便签 -->
      <div class="notes">

        <!-- 左：我的标签 -->
        <div class="note-p note-left">
          <span class="nt">我的标签</span>
          <div class="rows">
            <div class="r">
              <div class="ic"><img src="icons-journal/out/medal.png" alt=""></div>
              <span>称号墙</span>
            </div>
            <div class="r">
              <div class="ic"><img src="icons-journal/out/cert.png" alt=""></div>
              <span>学生认证</span>
            </div>
            <div class="r">
              <div class="ic"><img src="icons-journal/out/heart.png" alt=""></div>
              <span>我的好友</span>
            </div>
            <div class="r">
              <div class="ic"><img src="icons-journal/out/tag.png" alt=""></div>
              <span>我的搭子</span>
            </div>
          </div>
        </div>

        <!-- 右：称号墙 -->
        <div class="note-p note-right">
          <span class="nt">称号墙</span>
          <div class="rows">
            <div class="r">
              <div class="ic"><img src="icons-journal/out/medal.png" alt=""></div>
              <span>称号墙</span>
            </div>
            <div class="r">
              <div class="ic"><img src="icons-journal/out/bulb.png" alt=""></div>
              <span>还没有徽章称号</span>
            </div>
          </div>
          <div class="dash"></div>
        </div>

        <!-- 下：学生认证 -->
        <div class="note-p note-bottom">
          <span class="nt">学生认证</span>
          <div class="big">
            <div class="ic"><img src="icons-journal/out/cert.png" alt=""></div>
            <div class="tx">
              <h3>学生认证</h3>
              <p>认证后才能获得同校标识</p>
            </div>
          </div>
          <div class="go">去认证</div>
        </div>

      </div>

    </div>

    <nav class="tabbar">
      <div class="tab"><img src="icons-journal/out/home.png" alt=""></div>
      <div class="tab"><img src="icons-journal/out/plus.png" alt=""></div>
      <div class="gap"></div>
      <div class="tab"><img src="icons-journal/out/chat.png" alt=""></div>
      <div class="tab on"><img src="icons-journal/out/user.png" alt=""></div>
      <div class="fab"><img src="icons-journal/out/pencil.png" alt=""></div>
    </nav>

  </div>
</div>
</body>
</html>
